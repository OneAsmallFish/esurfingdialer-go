name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.0.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: verify tag
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 2
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$VERSION^{commit}")"

      - name: test before publishing
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: build
        run: sh scripts/build-release.sh

      - name: package
        run: |
          set -eu
          stage="esurfingdialer-${VERSION}"
          mkdir -p "pkg/$stage/bin" "pkg/$stage/docs" "pkg/$stage/examples"
          cp README.md LICENSE "pkg/$stage/"
          cp docs/*.md "pkg/$stage/docs/"
          cp examples/config.json.example "pkg/$stage/examples/"
          cp dist/esurfingdialer-* "pkg/$stage/bin/"
          (cd "pkg/$stage" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd pkg && tar -czf "../dist/$stage.tar.gz" "$stage")
          (cd pkg && zip -qr "../dist/$stage.zip" "$stage")
          (cd dist && sha256sum "$stage.tar.gz" "$stage.zip" >> SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cat > RELEASE_NOTES.md <<'NOTES'
          下载与系统、CPU 架构匹配的文件，使用 SHA256SUMS 校验。
          tar.gz / zip 包含二进制、配置示例和使用文档，不会自动修改路由器配置。

          用法见仓库 README，多拨配置见 docs/multi-dial.md。
          NOTES
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
            gh release edit "$VERSION" --title "esurfingdialer $VERSION" --notes-file RELEASE_NOTES.md
          else
            gh release create "$VERSION" dist/* --verify-tag --title "esurfingdialer $VERSION" --notes-file RELEASE_NOTES.md
          fi
